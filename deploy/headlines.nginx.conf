# 全球头条 · 静态站 nginx 配置（适用于任何香港/境外 VPS）
# 用法（setup.sh 会自动放置）：放到 /etc/nginx/sites-available/headlines 并启用
server {
    listen 80;
    listen [::]:80;
    server_name _;  # 换成你的域名，如 news.example.com

    root /var/www/headlines;
    index index.html;

    # 根路径直接 302 到默认语言（zh），避免 JS 闪跳
    location = / {
        return 302 /zh/index.html;
    }

    # 本站所有内链都是显式 .html 文件，按文件优先解析即可
    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源长缓存（带 hash 的文件可永久缓存；这里按扩展名粗分）
    location ~* \.(?:js|css|svg|woff2?|png|jpg|jpeg|gif|webp|ico|xml|txt|json)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # RSS / sitemap
    location ~* \.(?:xml|txt)$ {
        add_header Content-Type "application/$1; charset=utf-8" always;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;
}
