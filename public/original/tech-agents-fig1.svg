<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#121a30"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#f5a524" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b6cff"/>
      <stop offset="1" stop-color="#0f3aa6"/>
    </linearGradient>
  </defs>
  <rect width="820" height="560" fill="url(#bg)"/>
  <text x="40" y="46" fill="#eaf1ff" font-size="22" font-weight="700">企业级智能体 · 四层商业演进框架</text>
  <text x="40" y="72" fill="#8aa0c6" font-size="13">供给交付 → 要素变现 → 产业资本 → 组织治理</text>
  <line x1="40" y1="96" x2="780" y2="96" stroke="#22304d" stroke-width="1"/>

  <!-- Layer 1 供给交付 -->
  <g>
    <rect x="40" y="116" width="740" height="86" rx="12" fill="url(#band)" stroke="#2a3a5e"/>
    <rect x="40" y="116" width="6" height="86" rx="3" fill="#f5a524"/>
    <text x="64" y="148" fill="#ffd479" font-size="16" font-weight="700">供给交付</text>
    <text x="64" y="172" fill="#9fb2d4" font-size="12">如何把智能体交付进企业</text>
    <circle cx="360" cy="159" r="22" fill="url(#node)"/><text x="360" y="163" fill="#fff" font-size="11" text-anchor="middle">多入口</text>
    <circle cx="470" cy="159" r="22" fill="url(#node)"/><text x="470" y="163" fill="#fff" font-size="11" text-anchor="middle">产品矩阵</text>
    <circle cx="580" cy="159" r="22" fill="url(#node)"/><text x="580" y="163" fill="#fff" font-size="11" text-anchor="middle">FDE</text>
    <circle cx="690" cy="159" r="22" fill="url(#node)"/><text x="690" y="163" fill="#fff" font-size="11" text-anchor="middle">L0–L5</text>
  </g>

  <!-- Layer 2 要素变现 -->
  <g>
    <rect x="40" y="216" width="740" height="86" rx="12" fill="url(#band)" stroke="#2a3a5e"/>
    <rect x="40" y="216" width="6" height="86" rx="3" fill="#f5a524"/>
    <text x="64" y="248" fill="#ffd479" font-size="16" font-weight="700">要素变现</text>
    <text x="64" y="272" fill="#9fb2d4" font-size="12">凭什么决策、如何结算</text>
    <circle cx="360" cy="259" r="22" fill="url(#node)"/><text x="360" y="263" fill="#fff" font-size="11" text-anchor="middle">实时上下文</text>
    <circle cx="520" cy="259" r="22" fill="url(#node)"/><text x="520" y="263" fill="#fff" font-size="11" text-anchor="middle">AWU 计费</text>
    <circle cx="680" cy="259" r="22" fill="url(#node)"/><text x="680" y="263" fill="#fff" font-size="11" text-anchor="middle">结果定价</text>
  </g>

  <!-- Layer 3 产业资本 -->
  <g>
    <rect x="40" y="316" width="740" height="86" rx="12" fill="url(#band)" stroke="#2a3a5e"/>
    <rect x="40" y="316" width="6" height="86" rx="3" fill="#f5a524"/>
    <text x="64" y="348" fill="#ffd479" font-size="16" font-weight="700">产业与资本</text>
    <text x="64" y="372" fill="#9fb2d4" font-size="12">价值链重心与估值分化</text>
    <circle cx="360" cy="359" r="22" fill="url(#node)"/><text x="360" y="363" fill="#fff" font-size="11" text-anchor="middle">Harness 编排层</text>
    <circle cx="560" cy="359" r="22" fill="url(#node)"/><text x="560" y="363" fill="#fff" font-size="11" text-anchor="middle">美国：替代</text>
    <circle cx="690" cy="359" r="22" fill="url(#node)"/><text x="690" y="363" fill="#fff" font-size="11" text-anchor="middle">中国：增值</text>
  </g>

  <!-- Layer 4 组织治理 -->
  <g>
    <rect x="40" y="416" width="740" height="86" rx="12" fill="url(#band)" stroke="#2a3a5e"/>
    <rect x="40" y="416" width="6" height="86" rx="3" fill="#f5a524"/>
    <text x="64" y="448" fill="#ffd479" font-size="16" font-weight="700">组织与治理</text>
    <text x="64" y="472" fill="#9fb2d4" font-size="12">人机协作秩序与合规底座</text>
    <circle cx="360" cy="459" r="22" fill="url(#node)"/><text x="360" y="463" fill="#fff" font-size="11" text-anchor="middle">科层协作</text>
    <circle cx="500" cy="459" r="22" fill="url(#node)"/><text x="500" y="463" fill="#fff" font-size="11" text-anchor="middle">蜂巢组织</text>
    <circle cx="640" cy="459" r="22" fill="url(#node)"/><text x="640" y="463" fill="#fff" font-size="11" text-anchor="middle">KYA 身份</text>
  </g>

  <text x="40" y="540" fill="#5f6f8c" font-size="11">原创配图 · Starteday 编辑部 · 据高金/蚂蚁《2026 企业级智能体商业演进十大趋势洞察》重绘</text>
</svg>
